<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tez Rigs | Custom gaming PCs, hand-built in Hyderabad</title>
  <meta name="description" content="Tez hand-builds gaming and creator PCs in Hyderabad, forty a month. Scroll to go inside one, see how we build, and spec your own rig.">
  <meta name="theme-color" content="#07080a">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#approach">Skip the opening film</a>

  <header class="bar">
    <a class="mark" href="#top" aria-label="Tez Rigs, back to the top"><span class="mark-sun" aria-hidden="true"></span><span id="brand">Tez</span></a>
    <a class="bar-link" href="#start" id="barStart">Start your build</a>
  </header>

  <main>
    <!-- Opening: the page pins, and scrolling flies the camera through the glass and into the PC -->
    <section class="fly" id="top" aria-label="Three custom PCs. Scrolling moves the camera through the glass of the middle one.">
      <div class="fly-pin">
        <canvas class="fly-film" id="film" aria-hidden="true"></canvas>
        <div class="fly-shade" aria-hidden="true"></div>
        <div class="fly-hero" id="hero">
          <h1 class="display" id="heroTitle"></h1>
          <p id="heroNote"></p>
        </div>
        <div class="fly-say" id="say">
          <p class="display" id="sayText"></p>
        </div>
        <p class="fly-hint" id="hint" aria-hidden="true"><span class="fly-hint-line"></span><span id="hintText"></span></p>
        <div class="fly-black" id="black" aria-hidden="true"></div>
      </div>
    </section>

    <!-- A picture that grows from the middle of the screen -->
    <section class="approach" id="approach">
      <div class="approach-pin">
        <div class="approach-pic"><div id="approachPic"></div></div>
        <div class="approach-shade" aria-hidden="true"></div>
        <div class="approach-words">
          <p class="tag" id="approachLabel"></p>
          <h2 class="display" id="approachTitle"></h2>
        </div>
        <div class="approach-foot">
          <ul class="facts" id="facts"></ul>
          <div class="approach-side">
            <p id="approachText"></p>
            <a class="btn" href="#start" id="approachButton"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- Three ideas, one at a time -->
    <section class="values" id="values" aria-label="How we think about a build">
      <div class="values-pin">
        <div class="values-bg" id="valuesBg" aria-hidden="true"></div>
        <div class="values-list" id="valuesList"></div>
      </div>
    </section>

    <!-- A sentence that lights up as you scroll -->
    <section class="line" id="line">
      <p class="display" id="lineText"></p>
    </section>

    <!-- What we do -->
    <section class="services" id="services" aria-label="What we do">
      <div class="services-pin">
        <div class="services-pics" id="servicePics" aria-hidden="true"></div>
        <div class="services-words" id="serviceWords"></div>
        <ol class="services-index" id="serviceIndex" aria-label="Jump to a service"></ol>
      </div>
    </section>

    <!-- Start your build -->
    <section class="start" id="start">
      <div class="wrap start-grid">
        <div>
          <p class="tag" id="startLabel"></p>
          <h2 class="display" id="startTitle"></h2>
          <p class="start-text" id="startText"></p>
          <p class="start-contact"><a id="startPhone"></a><a id="startEmail"></a></p>
        </div>
        <form class="form" id="startForm" novalidate>
          <div class="field">
            <label for="fName">Your name</label>
            <input id="fName" name="name" type="text" autocomplete="name" required aria-describedby="fNameErr">
            <p class="field-error" id="fNameErr"></p>
          </div>
          <div class="field">
            <label for="fPhone">Phone number</label>
            <input id="fPhone" name="phone" type="tel" autocomplete="tel" required aria-describedby="fPhoneErr">
            <p class="field-error" id="fPhoneErr"></p>
          </div>
          <div class="field">
            <label for="fAbout">What you play, or the apps you run <span class="optional">(optional)</span></label>
            <input id="fAbout" name="about" type="text">
          </div>
          <div class="field">
            <label for="fNote">Budget, and anything else <span class="optional">(optional)</span></label>
            <textarea id="fNote" name="note" rows="3"></textarea>
          </div>
          <button class="btn btn-solid" type="submit" id="startButton"></button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-row">
      <p class="footer-mark" id="footMark"></p>
      <p id="footCity"></p>
      <p class="footer-note">Demo site. The company, what it makes and the contact details are invented, and the pictures are computer-generated.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
